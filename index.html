<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Agency</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow-x: hidden;
      color: white;
      text-align: center;
      background: radial-gradient(circle at top, #1b0033, #000010 60%, #000000);
    }

    /* cosmic stars */
    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      z-index: 0;
    }

    .stars::before, .stars::after {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: transparent;
      background-image: radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveStars 120s linear infinite;
      opacity: 0.3;
    }

    .stars::after {
      background-size: 80px 80px;
      animation-duration: 200s;
      opacity: 0.2;
    }

    @keyframes moveStars {
      from { transform: translateY(0); }
      to { transform: translateY(-1000px); }
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 80px 20px;
    }

    h1 {
      font-size: 3.5rem;
      background: linear-gradient(90deg, #7f00ff, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      margin-top: 15px;
      opacity: 0.9;
    }

    .card {
      margin-top: 40px;
      display: inline-block;
      padding: 25px;
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(127,0,255,0.2);
    }

    .contact {
      margin-top: 30px;
      font-size: 1rem;
      line-height: 1.8;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 25px;
      border-radius: 30px;
      background: linear-gradient(90deg, #7f00ff, #00d4ff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="container">
    <h1>Nova Agency</h1>
    <p>AI-Powered Appointment Setting & Lead Generation</p>

    <div class="card">
      <p>We help businesses book more qualified appointments using AI-powered outreach systems, automation, and smart follow-ups.</p>

      <a class="btn" href="https://calendly.com/your-link-here" target="_blank">Book a Free Consultation</a>

      <div class="contact">
        <p><strong>Contact Us</strong></p>
        <p>Email: yourname@outlook.com</p>
        <p>Instagram: @novaagency</p>
        <p>Phone: (000) 000-0000</p>
      </div>
    </div>
  </div>

</body>
</html>
